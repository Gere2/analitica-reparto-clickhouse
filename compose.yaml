services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: bd2-clickhouse
    environment:
      CLICKHOUSE_DB: delivery
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: demo
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8124:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/bd2.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "demo", "--password", "demo", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  atlas:
    profiles: ["atlas"]
    build:
      context: .
      dockerfile: Dockerfile.atlas
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123/
      CLICKHOUSE_USER: demo
      CLICKHOUSE_PASSWORD: demo
      ATLAS_QUEUE_PATH: /state/outbox.sqlite
      ATLAS_MAX_PENDING: "200000"
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - atlas_queue:/state
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/health', timeout=5).read()"]
      interval: 5s
      timeout: 6s
      retries: 20

volumes:
  clickhouse_data:
  atlas_queue:
