<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title desc" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#18242d">
  <title id="title">How data reaches the Delivery Atlas dashboard</title>
  <desc id="desc">Fictional data from the traffic simulator, the AI agents and the mini-app goes through the Atlas API, a durable SQLite queue and a batch publisher into the delivery_atlas database, where materialized views keep the latest state. Real public datasets from Criteo and Glovo are verified and bulk-loaded once into the delivery database. The read API serves both to the local dashboard, with three separate views, and through a read-only gateway to the shared Vercel site.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52645b"/>
    </marker>
  </defs>

  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="32" y="44" font-size="24" font-weight="700">How data reaches the dashboard</text>
  <text x="32" y="68" font-size="13" fill="#52645b">Three kinds of data in one ClickHouse, never mixed: fictional data generated live, and real public data loaded once.</text>

  <!-- Lanes -->
  <text x="32" y="104" font-size="11" font-weight="700" letter-spacing="1" fill="#24553d">LIVE · FICTIONAL DATA, GENERATED DURING THE DEMO</text>
  <line x1="32" y1="478" x2="904" y2="478" stroke="#b7c8bb" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="32" y="500" font-size="11" font-weight="700" letter-spacing="1" fill="#a96224">DOWNLOADED · REAL PUBLIC DATA, LOADED ONCE</text>

  <!-- Live sources -->
  <g font-size="11">
    <rect x="32" y="118" width="170" height="62" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
    <rect x="32" y="128" width="4" height="42" rx="2" fill="#24553d"/>
    <text x="48" y="144" font-size="14" font-weight="700">Traffic simulator</text>
    <text x="48" y="163" fill="#52645b">rules + fixed seed</text>

    <rect x="32" y="196" width="170" height="62" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
    <rect x="32" y="206" width="4" height="42" rx="2" fill="#244e77"/>
    <text x="48" y="222" font-size="14" font-weight="700">AI agents</text>
    <text x="48" y="241" fill="#52645b">a local model decides</text>

    <rect x="32" y="274" width="170" height="62" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
    <rect x="32" y="284" width="4" height="42" rx="2" fill="#24553d"/>
    <text x="48" y="300" font-size="14" font-weight="700">Mini-app</text>
    <text x="48" y="319" fill="#52645b">our own clicks, by hand</text>
  </g>
  <g stroke="#52645b" stroke-width="1.5" fill="none">
    <line x1="202" y1="149" x2="226" y2="149"/>
    <line x1="202" y1="227" x2="226" y2="227"/>
    <line x1="202" y1="305" x2="226" y2="305"/>
    <line x1="226" y1="149" x2="226" y2="305"/>
    <line x1="226" y1="149" x2="249" y2="149" marker-end="url(#arrow)"/>
  </g>

  <!-- Write path -->
  <g font-size="11">
    <rect x="250" y="118" width="190" height="62" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
    <text x="266" y="144" font-size="14" font-weight="700">Atlas API</text>
    <text x="266" y="163" fill="#52645b">checks contract, prices, IDs</text>

    <rect x="250" y="226" width="190" height="62" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
    <text x="266" y="252" font-size="14" font-weight="700">SQLite queue</text>
    <text x="266" y="271" fill="#52645b">durable outbox · idempotent</text>

    <rect x="250" y="334" width="190" height="62" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
    <text x="266" y="360" font-size="14" font-weight="700">Publisher</text>
    <text x="266" y="379" fill="#52645b">one batch INSERT per table</text>
  </g>
  <g stroke="#52645b" stroke-width="1.5" fill="none">
    <line x1="345" y1="180" x2="345" y2="225" marker-end="url(#arrow)"/>
    <line x1="345" y1="288" x2="345" y2="333" marker-end="url(#arrow)"/>
    <line x1="440" y1="365" x2="505" y2="365" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10.5" fill="#52645b">
    <text x="353" y="207">accepted (202)</text>
    <text x="353" y="315">in order</text>
    <text x="463" y="357" text-anchor="middle">INSERT</text>
  </g>

  <!-- ClickHouse -->
  <rect x="486" y="96" width="418" height="560" rx="12" fill="#eef3ec" stroke="#24553d" stroke-width="1.5"/>
  <text x="504" y="124" font-size="15" font-weight="700" fill="#24553d">ClickHouse 25.8 · one node</text>
  <text x="506" y="148" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#52645b">database delivery_atlas</text>

  <rect x="506" y="158" width="160" height="240" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
  <text x="522" y="184" font-size="14" font-weight="700">Every event</text>
  <text x="522" y="201" font-size="10.5" fill="#52645b">ReplacingMergeTree</text>
  <g font-size="11" font-family="Consolas, Menlo, monospace">
    <text x="522" y="228">app_events</text>
    <text x="522" y="246">customer_activity</text>
    <text x="522" y="264">customer_orders</text>
    <text x="522" y="282">order_events</text>
    <text x="522" y="300">courier_positions</text>
  </g>
  <text x="522" y="328" font-size="10.5" fill="#52645b">insert-only: a change</text>
  <text x="522" y="343" font-size="10.5" fill="#52645b">is a new row</text>
  <text x="522" y="368" font-size="10.5" fill="#52645b">a resent batch is</text>
  <text x="522" y="383" font-size="10.5" fill="#52645b">collapsed by FINAL</text>

  <line x1="666" y1="232" x2="733" y2="232" stroke="#52645b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="224" font-size="10.5" text-anchor="middle" fill="#52645b">on INSERT</text>
  <text x="700" y="248" font-size="10" text-anchor="middle" fill="#52645b">materialized</text>
  <text x="700" y="261" font-size="10" text-anchor="middle" fill="#52645b">views</text>

  <rect x="734" y="158" width="150" height="160" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
  <text x="750" y="184" font-size="14" font-weight="700">Latest state</text>
  <text x="750" y="201" font-size="10" fill="#52645b">AggregatingMergeTree</text>
  <g font-size="11" font-family="Consolas, Menlo, monospace">
    <text x="750" y="228">courier_latest</text>
    <text x="750" y="246">order_latest</text>
    <text x="750" y="264">customer_latest</text>
  </g>
  <text x="750" y="292" font-size="10.5" fill="#52645b">one row per courier,</text>
  <text x="750" y="306" font-size="10.5" fill="#52645b">order and customer</text>

  <text x="506" y="502" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#52645b">database delivery</text>
  <rect x="506" y="512" width="378" height="128" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
  <rect x="506" y="522" width="4" height="108" rx="2" fill="#a96224"/>
  <text x="522" y="538" font-size="14" font-weight="700">Downloaded datasets</text>
  <text x="522" y="555" font-size="10.5" fill="#52645b">MergeTree, sorted by the columns queried</text>
  <g font-size="11">
    <text x="522" y="582" font-family="Consolas, Menlo, monospace">criteo_uplift</text>
    <text x="680" y="582">13,979,592 rows · 262 MiB</text>
    <text x="522" y="602" font-family="Consolas, Menlo, monospace">glovo_products</text>
    <text x="680" y="602">2,887,444 rows · 129 MiB</text>
  </g>
  <text x="522" y="627" font-size="10.5" fill="#52645b">GROUP BY over all 14 M rows: about 140 ms</text>

  <!-- Downloaded sources -->
  <g font-size="11">
    <rect x="32" y="530" width="170" height="72" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
    <rect x="32" y="540" width="4" height="52" rx="2" fill="#a96224"/>
    <text x="48" y="556" font-size="14" font-weight="700">Public sources</text>
    <text x="48" y="574" fill="#52645b">Criteo · Hugging Face</text>
    <text x="48" y="590" fill="#52645b">Glovo · public bucket</text>

    <rect x="250" y="530" width="190" height="72" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
    <text x="266" y="556" font-size="14" font-weight="700">Loader scripts</text>
    <text x="266" y="574" font-size="10.5" font-family="Consolas, Menlo, monospace">criteo.py · glovo.py</text>
    <text x="266" y="590" fill="#52645b">size + SHA-256 checked</text>
  </g>
  <g stroke="#52645b" stroke-width="1.5" fill="none">
    <line x1="202" y1="566" x2="249" y2="566" marker-end="url(#arrow)"/>
    <line x1="440" y1="566" x2="505" y2="566" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10" fill="#52645b" text-anchor="middle">
    <text x="226" y="558">880 MB</text>
    <text x="463" y="558">INSERT</text>
  </g>

  <!-- Read path -->
  <g stroke="#52645b" stroke-width="1.5" fill="none">
    <line x1="884" y1="210" x2="959" y2="210" marker-end="url(#arrow)"/>
    <polyline points="884,566 932,566 932,244 959,244" marker-end="url(#arrow)"/>
    <line x1="1104" y1="262" x2="1104" y2="299" marker-end="url(#arrow)"/>
    <polyline points="1248,224 1264,224 1264,533 1249,533" marker-end="url(#arrow)"/>
  </g>
  <g font-size="10" fill="#52645b" text-anchor="middle">
    <text x="932" y="202">SELECT</text>
    <text x="940" y="449" text-anchor="start">GROUP BY</text>
  </g>
  <text x="1112" y="286" font-size="10.5" fill="#52645b">JSON</text>
  <text x="1274" y="380" font-size="10" fill="#52645b" text-anchor="middle" transform="rotate(90 1274 380)">same reads, through the gateway</text>

  <g font-size="11">
    <rect x="960" y="158" width="288" height="104" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
    <text x="976" y="184" font-size="14" font-weight="700">Atlas API · reads</text>
    <text x="976" y="204" font-size="10.5" font-family="Consolas, Menlo, monospace">/api/operations · live views</text>
    <text x="976" y="222" font-size="10.5" font-family="Consolas, Menlo, monospace">/api/datasets · real data</text>
    <text x="976" y="246" font-size="10.5" fill="#52645b">one shared read every 1.5 s</text>

    <rect x="960" y="300" width="288" height="124" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
    <text x="976" y="326" font-size="14" font-weight="700">Dashboard</text>
    <text x="976" y="344" font-size="10.5" fill="#52645b">127.0.0.1:8001 · polls every 2 s</text>
    <rect x="976" y="358" width="84" height="24" rx="12" fill="#dfeeda"/>
    <text x="1018" y="374" font-size="10.5" font-weight="700" fill="#24553d" text-anchor="middle">Simulated</text>
    <rect x="1068" y="358" width="78" height="24" rx="12" fill="#e1ebf5"/>
    <text x="1107" y="374" font-size="10.5" font-weight="700" fill="#244e77" text-anchor="middle">AI agents</text>
    <rect x="1154" y="358" width="86" height="24" rx="12" fill="#f6e7d8"/>
    <text x="1197" y="374" font-size="10.5" font-weight="700" fill="#8a4d18" text-anchor="middle">Downloaded</text>
    <text x="976" y="408" font-size="10.5" font-family="Consolas, Menlo, monospace" fill="#52645b">?view=simulated | ai | real</text>

    <rect x="960" y="466" width="288" height="134" rx="8" fill="#ffffff" stroke="#b7c8bb"/>
    <text x="976" y="492" font-size="14" font-weight="700">Shared site · read-only</text>
    <text x="976" y="510" font-size="10.5" font-family="Consolas, Menlo, monospace">delivery-atlas-demo.vercel.app</text>
    <text x="976" y="534">Vercel → Cloudflare tunnel →</text>
    <text x="976" y="551">gateway: token, GET only</text>
    <text x="976" y="576" font-size="10.5" fill="#52645b">same three views, no controls</text>
  </g>

  <text x="32" y="692" font-size="12" fill="#52645b">Fictional orders, prices and GPS; no payments. The real datasets have no GPS or orders and are never joined with the simulation.</text>
</svg>
